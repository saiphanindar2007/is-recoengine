name: CI

# Runs on every push and pull request. This is a REAL pipeline (not just
# documented as one in the README) — it actually installs dependencies,
# runs the full backend pytest suite, and runs a real frontend production
# build, and the job fails if either fails. No steps are allowed to
# silently swallow a non-zero exit code.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  backend-tests:
    name: Backend — pytest (47+ tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (TF-IDF-only mode — deterministic, no model download)
        env:
          APP_ENV: development
          JWT_SECRET_KEY: ci-test-secret-not-for-production
          DATABASE_URL: sqlite:///./ci_test_is_reco.db
          EMBEDDING_MODE: tfidf_only
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          RATE_LIMIT_ENABLED: "false"
        run: |
          pytest --junitxml=pytest-report.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml

  frontend-build:
    name: Frontend — production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        env:
          VITE_API_BASE: https://placeholder-backend.onrender.com
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # Gate job: branch protection can require this single check instead of
  # naming both jobs individually, and it only succeeds if both real jobs did.
  ci-summary:
    name: CI summary
    if: always()
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ] || [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "backend-tests: ${{ needs.backend-tests.result }}"
            echo "frontend-build: ${{ needs.frontend-build.result }}"
            exit 1
          fi
          echo "All CI checks passed."
