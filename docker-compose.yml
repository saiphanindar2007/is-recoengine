version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8010:8000"
    environment:
      # APP_ENV intentionally left as "development" here — docker-compose is for local
      # use. Set APP_ENV=production + a real JWT_SECRET_KEY at actual deploy time
      # (Render env vars / docker run -e), where app/auth.py enforces a strong secret.
      - APP_ENV=development
      - JWT_SECRET_KEY=dev-secret-change-in-production
      - DATABASE_URL=sqlite:///./is_reco.db
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - EMBEDDING_MODE=tfidf_only
      - RATE_LIMIT_ENABLED=true
      - LOG_LEVEL=INFO
    volumes:
      - backend_data:/app
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8010
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  backend_data:
